[project]
name = "usd-rub-rate-bot"
version = "0.1.0"
description = "Telegram bot that periodically publishes USD/RUB cash buy/sell rates from several banks and the Central Bank of Russia."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Zaikin Software Solutions" }]
requires-python = ">=3.12"

dependencies = [
    "aiogram>=3.26,<4",
    "aiohttp>=3.10,<4",
    "apscheduler>=3.10,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "structlog>=24.4,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.23,<1",
    "aioresponses>=0.7,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[project.scripts]
usd-rub-rate-bot = "usd_rub_rate_bot.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usd_rub_rate_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "ASYNC",            # async pitfalls
    "PL",               # pylint subset
]
ignore = [
    "PLR0913",          # too many arguments
    "PLR2004",          # magic value in comparison
    "SIM105",           # try/except/pass is fine for optional signal handler
    "RUF001",           # we intentionally use the Unicode MINUS SIGN in user-facing messages
    "RUF002",           # same minus appears in docstrings showing sample output
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
pretty = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "aioresponses.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
