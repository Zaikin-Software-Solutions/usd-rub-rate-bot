# Production compose: pulls the prebuilt multi-arch image from GHCR.
# For local development with rebuild-on-change, use:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  usd-rub-rate-bot:
    image: ghcr.io/zaikin-software-solutions/usd-rub-rate-bot:latest
    container_name: usd-rub-rate-bot
    restart: unless-stopped
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
